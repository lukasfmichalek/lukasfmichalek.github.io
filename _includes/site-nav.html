<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      {% assign current = page.url | remove: 'index.html' %}
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}"{% if current == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">&#9776;</button>
  </div>
</header>
<script>
  document.getElementById('nav-toggle').addEventListener('click', function () {
    var nav = document.getElementById('site-nav');
    var open = nav.classList.toggle('open');
    this.setAttribute('aria-expanded', open);
  });
</script>
