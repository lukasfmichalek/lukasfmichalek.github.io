# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Frontier Metrology
name: &name "Lukas Michalek"
email: lukasmi@stanford.edu
description: >-
  Research at the intersection of scanning probe microscopy, infrared
  nanospectroscopy, and polymer physics. Developing measurement techniques
  that make nanoscale material properties directly observable.
 
url: "https://lukasfmichalek.github.io"   # TODO: change to https://frontier-metrology.com in Part 9
baseurl: ""                                # must stay empty for a user site
repository: "lukasfmichalek/lukasfmichalek.github.io"
 
github_username: lukasfmichalek
 
minimal_mistakes_skin: "dirt"   # try: default, air, contrast, mint, sunrise, neon, dirt
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name        : Lukas Michalek
  avatar      : "/assets/images/LFM Headshot (medium).jpg"   # replace this file in Part 8
  bio         : "Postdoctoral researcher, Bao Group, Stanford University. Building instruments that measure what was previously inferred."
  location    : "Stanford, CA"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:lukasmi@stanford.edu.com"          
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=Bzq4YZ0AAAAJ&hl=en"   
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-2257-5038"              
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lukas-michalek-89a692157/"            
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lukasfmichalek"

footer:
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=Bzq4YZ0AAAAJ&hl=en"   
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-2257-5038"    
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lukasfmichalek"
      
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
